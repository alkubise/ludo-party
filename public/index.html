<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Party</title><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script></head><body>
<div class="bg"></div><header><div class="logo">🎲 <span>Ludo</span><small>PARTY!</small></div><div class="room-pill" id="roompill">🌐 غرفة اللعب <strong>—</strong></div><div class="top-icons"><button onclick="soundToggle()">🔊</button><button onclick="copyRoom()">🔗</button><button onclick="showHelp()">❔</button></div></header>
<main><section class="setup" id="setup"><div class="hero"><h1>اللعب صار <span>حريقة! 🔥</span></h1><p>لمّ أصحابك… وخلّي الحظ يحكم 😈</p></div><div class="join-card"><input id="name" maxlength="16" placeholder="اسمك المستعار" value="لاعب"><input id="room" maxlength="8" placeholder="رمز الغرفة (اختياري)"><div class="color-select"><button data-color="red" class="pick red">🔴</button><button data-color="blue" class="pick blue">🔵</button><button data-color="green" class="pick green">🟢</button><button data-color="yellow" class="pick yellow">🟡</button></div><button class="join-btn" onclick="join()">🚀 ادخل اللعب</button><p class="tip">أنشئ غرفة أو أدخل رمز صديقك</p></div></section>
<section id="game" class="game hidden"><div class="players" id="players"></div><div class="board-wrap"><div class="board" id="board"><div class="center"><div class="crown">👑</div><div>LU<span>DO</span></div><small>PARTY</small></div><div class="home red-home"><div class="home-label">❤️ RED</div><div class="slots" id="slots-red"></div></div><div class="home blue-home"><div class="home-label">💙 BLUE</div><div class="slots" id="slots-blue"></div></div><div class="home green-home"><div class="home-label">💚 GREEN</div><div class="slots" id="slots-green"></div></div><div class="home yellow-home"><div class="home-label">💛 YELLOW</div><div class="slots" id="slots-yellow"></div></div><div class="track" id="track"></div></div></div><div class="controls"><div class="status" id="status">بانتظار اللاعبين…</div><button class="dice-btn" id="dice" onclick="roll()"><span id="diceface">🎲</span><strong>ارمِ النرد</strong></button><div class="hint" id="hint">اضغط النرد لتبدأ</div></div><div class="emoji-panel"><div class="emoji-title">😈 صندوق الاستفزاز</div><div class="emoji-grid"><button onclick="sendEmoji('😂')">😂</button><button onclick="sendEmoji('😎')">😎</button><button onclick="sendEmoji('😡')">😡</button><button onclick="sendEmoji('😜')">😜</button><button onclick="sendEmoji('😭')">😭</button><button onclick="sendEmoji('😱')">😱</button><button onclick="sendEmoji('👏')">👏</button><button onclick="sendEmoji('🔥')">🔥</button><button onclick="sendEmoji('👑')">👑</button><button onclick="sendEmoji('🏁')">🏁</button><button onclick="sendEmoji('🤡')">🤡</button><button onclick="sendEmoji('💀')">💀</button></div></div></section></main><div id="toast"></div><div id="emoji-float"></div><script src="app.js"></script></body></html>
