<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1646">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ludo Party | لودو بارتي</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.3M12 17.2v.1"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 00-2 2v12a2 2 0 002 2h4M15 8l4 4-4 4M19 12H9"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4.2 4.2 0 007 0M9 9.5v.5M15 9.5v.5"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5v.1M3 3l18 18"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7V5z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 011 1v10a1 1 0 01-1 1h-8l-5 4v-4H4a1 1 0 01-1-1V6a1 1 0 011-1z"/><path d="M8 10h8M8 13h5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.4 0 2-1 1.6-2-.5-1.2.3-2.4 1.7-2.4H17a4 4 0 004-4c0-5-4-9.6-9-9.6z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0M16 5.2a3.2 3.2 0 010 6M18 14.5a6 6 0 013 5.5"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="bg"></div>

  <!-- MENU -->
  <section id="screen-menu" class="screen active">
    <div class="top-actions">
      <button class="btn sm style-pill" id="btn-style"><svg class="ic"><use href="#i-palette"/></svg><span data-i18n="btnStyle"></span></button>
      <button class="btn icon" id="btn-help" aria-label="How to play" data-i18n-aria="help"><svg class="ic"><use href="#i-help"/></svg></button>
      <button class="btn icon" id="btn-sound" aria-label="Sound" data-i18n-aria="sound"><svg class="ic"><use href="#i-sound"/></svg></button>
      <button class="btn icon" id="btn-settings" aria-label="Settings" data-i18n-aria="settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>
    <div class="menu-body">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="6" y="9" width="52" height="52" rx="14" fill="#0d0a2e" opacity=".5"/>
          <rect x="6" y="5" width="52" height="52" rx="14" fill="#fff" stroke="#1a1646" stroke-width="4"/>
          <circle cx="22" cy="21" r="6" fill="#ef4444"/><circle cx="42" cy="21" r="6" fill="#22c55e"/>
          <circle cx="22" cy="41" r="6" fill="#3b82f6"/><circle cx="42" cy="41" r="6" fill="#fbbf24"/>
          <path d="M14 14c4-4 10-5 15-4" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7" fill="none"/>
        </svg>
        <div class="logo-text"><span class="l1" data-i18n="logo1">لودو</span><span class="l2" data-i18n="logo2">بارتي</span></div>
      </div>
      <p class="tagline" data-i18n="tagline"></p>

      <div class="card profile">
        <button class="avatar-btn" id="btn-avatar-menu" aria-label="Avatar" data-i18n-aria="chooseAvatar"><span class="avatar big" id="menu-avatar"></span><span class="edit-dot"><svg class="ic"><use href="#i-plus"/></svg></span></button>
        <div class="field grow">
          <label for="inp-name" data-i18n="nickname"></label>
          <input id="inp-name" maxlength="14" autocomplete="off" dir="auto" data-i18n-ph="nickPh">
        </div>
      </div>

      <div class="stats-line" id="menu-stats"></div>
      <div class="stack">
        <button class="btn primary xl" id="btn-play"><svg class="ic"><use href="#i-play"/></svg><span data-i18n="play"></span></button>
        <div class="row2">
          <button class="btn secondary" id="btn-create"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="create"></span></button>
          <button class="btn secondary" id="btn-join"><svg class="ic"><use href="#i-users"/></svg><span data-i18n="join"></span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- CUSTOMIZE (board themes, pawn skins, dice skins) -->
  <section id="screen-style" class="screen">
    <header class="bar">
      <button class="btn icon" id="btn-style-back" aria-label="Back" data-i18n-aria="back"><svg class="ic ic-back"><use href="#i-back"/></svg></button>
      <h2 data-i18n="styleTitle"></h2><span class="bar-sp"></span>
    </header>
    <div class="style-body">
      <div class="style-preview" id="style-preview"><div class="style-fallback" id="style-fallback" hidden data-i18n="styleNo3d"></div></div>
      <div class="seg tabs" id="style-tabs">
        <button data-tab="board" class="on" data-i18n="tabBoard"></button><button data-tab="pawn" data-i18n="tabPawn"></button><button data-tab="dice" data-i18n="tabDice"></button>
      </div>
      <div class="style-options" id="style-options"></div>
      <div class="muted small center" data-i18n="styleNote"></div>
    </div>
  </section>

  <!-- CREATE ROOM -->
  <section id="screen-create" class="screen">
    <header class="bar">
      <button class="btn icon" data-nav="menu" aria-label="Back" data-i18n-aria="back"><svg class="ic ic-back"><use href="#i-back"/></svg></button>
      <h2 data-i18n="createTitle"></h2><span class="bar-sp"></span>
    </header>
    <div class="form-body">
      <div class="card">
        <div class="profile">
          <button class="avatar-btn" data-avatar-open aria-label="Avatar"><span class="avatar big" data-avatar-view></span><span class="edit-dot"><svg class="ic"><use href="#i-plus"/></svg></span></button>
          <div class="field grow"><label data-i18n="nickname"></label><input class="name-input" maxlength="14" autocomplete="off" dir="auto" data-i18n-ph="nickPh"></div>
        </div>
        <div class="field"><label data-i18n="yourColor"></label><div class="colors" id="create-colors"></div></div>
      </div>
      <button class="btn primary xl" id="btn-create-go"><span data-i18n="createBtn"></span></button>
    </div>
  </section>

  <!-- JOIN ROOM -->
  <section id="screen-join" class="screen">
    <header class="bar">
      <button class="btn icon" data-nav="menu" aria-label="Back" data-i18n-aria="back"><svg class="ic ic-back"><use href="#i-back"/></svg></button>
      <h2 data-i18n="joinTitle"></h2><span class="bar-sp"></span>
    </header>
    <div class="form-body">
      <div class="card">
        <div class="field"><label for="inp-code" data-i18n="roomCode"></label>
          <input id="inp-code" class="code-input" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" dir="ltr" placeholder="•••••"></div>
        <div id="join-status" class="join-status" aria-live="polite"></div>
        <div class="profile">
          <button class="avatar-btn" data-avatar-open aria-label="Avatar"><span class="avatar big" data-avatar-view></span><span class="edit-dot"><svg class="ic"><use href="#i-plus"/></svg></span></button>
          <div class="field grow"><label data-i18n="nickname"></label><input class="name-input" maxlength="14" autocomplete="off" dir="auto" data-i18n-ph="nickPh"></div>
        </div>
        <div class="field"><label data-i18n="yourColor"></label><div class="colors" id="join-colors"></div></div>
      </div>
      <button class="btn primary xl" id="btn-join-go"><span data-i18n="joinBtn"></span></button>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen">
    <header class="bar">
      <button class="btn icon" id="btn-lobby-leave" aria-label="Leave" data-i18n-aria="leave"><svg class="ic"><use href="#i-exit"/></svg></button>
      <h2 data-i18n="lobbyTitle"></h2>
      <div class="bar-right">
        <button class="btn icon" id="btn-lobby-chat" aria-label="Chat" data-i18n-aria="chatTitle"><svg class="ic"><use href="#i-chat"/></svg><span class="chat-badge" hidden></span></button>
        <button class="btn icon" id="btn-lobby-settings" aria-label="Settings" data-i18n-aria="settings"><svg class="ic"><use href="#i-gear"/></svg></button>
      </div>
    </header>
    <div class="form-body">
      <div class="card code-card">
        <div class="muted small" data-i18n="roomCodeLabel"></div>
        <button class="room-code" id="lobby-code" aria-label="Copy code"></button>
        <div class="row2">
          <button class="btn secondary sm" id="btn-copy"><svg class="ic"><use href="#i-copy"/></svg><span data-i18n="copy"></span></button>
          <button class="btn secondary sm" id="btn-share"><svg class="ic"><use href="#i-share"/></svg><span data-i18n="share"></span></button>
        </div>
      </div>
      <div class="slots" id="lobby-slots"></div>
      <button class="btn secondary sm" id="btn-lobby-style"><svg class="ic"><use href="#i-palette"/></svg><span data-i18n="lobbyStyle"></span></button>
      <button class="btn secondary sm" id="btn-addbot"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="addBot"></span></button>
      <div class="card room-rules" id="room-rules">
        <div class="set-row"><span data-i18n="timerLabel"></span>
          <div class="seg small" id="seg-timer"><button data-t="0" data-i18n="timerOff"></button><button data-t="15">15</button><button data-t="30">30</button><button data-t="45">45</button></div></div>
        <div class="set-row"><span data-i18n="bonusCapture"></span><button class="switch" id="rs-cap" role="switch" aria-checked="true"><i></i></button></div>
        <div class="set-row"><span data-i18n="bonusHome"></span><button class="switch" id="rs-home" role="switch" aria-checked="true"><i></i></button></div>
        <div class="set-row"><span data-i18n="chatSwitch"></span><button class="switch" id="rs-chat" role="switch" aria-checked="true"><i></i></button></div>
      </div>
      <div class="field"><label data-i18n="changeColor"></label><div class="colors" id="lobby-colors"></div></div>
      <div class="lobby-actions">
        <div class="muted small center" id="lobby-hint"></div>
        <button class="btn primary xl" id="btn-ready"></button>
        <button class="btn primary xl" id="btn-start"><svg class="ic"><use href="#i-play"/></svg><span data-i18n="start"></span></button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <header class="bar game-bar">
      <button class="btn icon" id="btn-g-exit" aria-label="Exit" data-i18n-aria="leave"><svg class="ic"><use href="#i-exit"/></svg></button>
      <button class="code-pill" id="g-code" aria-label="Copy code"><svg class="ic"><use href="#i-users"/></svg><span id="g-code-text"></span></button>
      <div class="bar-right">
        <button class="btn icon" id="btn-g-sound" aria-label="Sound" data-i18n-aria="sound"><svg class="ic"><use href="#i-sound"/></svg></button>
        <button class="btn icon" id="btn-g-settings" aria-label="Settings" data-i18n-aria="settings"><svg class="ic"><use href="#i-gear"/></svg></button>
      </div>
    </header>
    <div class="stage">
      <div class="hudrow top" id="hud-top"></div>
      <div class="board-wrap"><div class="board-frame"><svg id="board" viewBox="0 0 150 150" role="img" aria-label="Ludo board"></svg><div id="board3d" class="board3d-host" hidden role="img" aria-label="Ludo board"></div></div></div>
      <div class="hudrow bot" id="hud-bot"></div>
      <div class="dock">
        <button class="dice" id="dice" aria-label="Dice"><div class="tilt"><div class="cube" id="cube"></div></div></button>
        <div class="dock-mid">
          <div class="status" id="status" aria-live="polite"></div>
          <button class="btn primary roll" id="btn-roll"><span data-i18n="roll"></span></button>
        </div>
        <button class="btn icon round lg chat-btn" id="btn-chat-g" aria-label="Chat" data-i18n-aria="chatTitle"><svg class="ic"><use href="#i-chat"/></svg><span class="chat-badge" hidden></span></button>
        <button class="btn icon round lg" id="btn-emoji" aria-label="Reactions" data-i18n-aria="reactions"><svg class="ic"><use href="#i-smile"/></svg><span class="chat-badge" hidden></span></button>
        <div class="emoji-panel" id="emoji-panel" hidden></div>
      </div>
    </div>
  </section>

  <div id="chat-feed" aria-live="polite"></div>
  <aside id="chat-dock" hidden></aside>
  <div id="reaction-layer" aria-hidden="true"></div>
  <div id="confetti" aria-hidden="true"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="net-banner" hidden><svg class="ic"><use href="#i-wifi-off"/></svg><span id="net-text"></span></div>
  <div id="loader" hidden><div class="spinner"></div></div>

  <!-- MODALS -->
  <div class="modal chat-modal" id="modal-chat" hidden><div class="sheet chat-sheet">
    <div class="chat-head"><h3 data-i18n="chatTitle"></h3><button class="btn icon" data-close aria-label="Close" data-i18n-aria="close"><svg class="ic"><use href="#i-back"/></svg></button></div>
    <div class="muted small center" data-i18n="chatPrivacy"></div>
    <div class="chat-list" id="chat-list" aria-live="polite"></div>
    <div class="chat-off" id="chat-off" hidden data-i18n="chatOff"></div>
    <div class="chat-to" id="chat-to"></div>
    <div class="chat-emoji" id="chat-emoji" hidden></div>
    <div class="chat-row"><button class="btn secondary icon" id="btn-chat-emoji" aria-label="Emoji"><svg class="ic"><use href="#i-smile"/></svg></button><input id="chat-input" maxlength="200" autocomplete="off" dir="auto" enterkeyhint="send" data-i18n-ph="chatPh"><button class="btn primary icon" id="btn-chat-send" aria-label="Send" data-i18n-aria="chatSend"><svg class="ic"><use href="#i-send"/></svg></button></div>
  </div></div>

  <div class="modal" id="modal-avatar" hidden><div class="sheet">
    <h3 data-i18n="chooseAvatar"></h3><div class="avatar-grid" id="avatar-grid"></div>
    <button class="btn secondary" data-close data-i18n="close"></button></div></div>

  <div class="modal" id="modal-settings" hidden><div class="sheet">
    <h3 data-i18n="settingsTitle"></h3>
    <div class="set-row"><span data-i18n="language"></span>
      <div class="seg"><button id="lang-ar" data-lang="ar">العربية</button><button id="lang-en" data-lang="en">English</button></div></div>
    <div class="set-row"><span><svg class="ic"><use href="#i-sound"/></svg> <b data-i18n="sfx"></b></span><button class="switch" id="tg-sfx" role="switch" aria-checked="true"><i></i></button></div>
    <div class="set-row"><span><svg class="ic"><use href="#i-music"/></svg> <b data-i18n="music"></b></span><button class="switch" id="tg-music" role="switch" aria-checked="false"><i></i></button></div>
    <div class="set-col"><span><b data-i18n="gfxLabel"></b></span>
      <div class="seg small wrap" id="seg-gfx"><button data-gfx="auto" data-i18n="gfxAuto"></button><button data-gfx="high" data-i18n="gfxHigh"></button><button data-gfx="medium" data-i18n="gfxMed"></button><button data-gfx="low" data-i18n="gfxLow"></button><button data-gfx="classic" data-i18n="gfx2d"></button></div>
      <div class="muted small" id="gfx-note"></div></div>
    <div class="set-row"><span><b data-i18n="autoMove"></b></span><button class="switch" id="tg-auto" role="switch" aria-checked="true"><i></i></button></div>
    <div class="set-row"><span><b data-i18n="chatFeedToggle"></b></span><button class="switch" id="tg-feed" role="switch" aria-checked="true"><i></i></button></div>
    <div class="set-row"><span><b data-i18n="rotateBoard"></b></span><button class="switch" id="tg-rot" role="switch" aria-checked="true"><i></i></button></div>
    <button class="btn secondary" data-close data-i18n="close"></button></div></div>

  <div class="modal" id="modal-help" hidden><div class="sheet tall">
    <h3 data-i18n="helpTitle"></h3>
    <ol class="help-list"><li data-i18n="h1"></li><li data-i18n="h2"></li><li data-i18n="h3"></li><li data-i18n="h4"></li><li data-i18n="h5"></li><li data-i18n="h6"></li></ol>
    <button class="btn secondary" data-close data-i18n="close"></button></div></div>

  <div class="modal" id="modal-exit" hidden><div class="sheet">
    <h3 data-i18n="leaveTitle"></h3><p class="muted center" data-i18n="leaveText"></p>
    <div class="row2"><button class="btn secondary" data-close data-i18n="stay"></button><button class="btn danger" id="btn-exit-yes" data-i18n="leave"></button></div></div></div>

  <div class="modal" id="modal-result" hidden><div class="sheet result">
    <div class="trophy" aria-hidden="true">🏆</div>
    <div class="avatar xl" id="res-avatar"></div>
    <h3 id="res-title"></h3><p class="muted center" id="res-sub"></p><div class="res-table" id="res-table"></div>
    <div class="row2"><button class="btn primary" id="btn-again" data-i18n="playAgain"></button><button class="btn secondary" id="btn-res-exit" data-i18n="leave"></button></div></div></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/three.min.js"></script>
<script src="/shared/ludo.js"></script>
<script src="/shared/catalog.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/sound.js"></script>
<script src="/js/board.js"></script>
<script src="/js/board3d.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
